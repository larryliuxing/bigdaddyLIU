<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="战力截图结构示意">
  <rect width="1280" height="720" fill="#0b0f18"/>

  <rect x="60" y="80" width="1160" height="580" rx="16" fill="#141a28" stroke="#2a3348" stroke-width="2"/>
  <rect x="60" y="80" width="1160" height="44" fill="#1a2233"/>
  <text x="90" y="108" fill="#6b7385" font-size="15" font-family="sans-serif">游戏完整界面（示意）</text>

  <rect x="90" y="150" width="250" height="340" rx="10" fill="#101624" stroke="#2a3348" stroke-width="1.5"/>
