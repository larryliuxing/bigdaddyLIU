  <polygon points="215,230 255,255 240,300 190,300 175,255" fill="none" stroke="#334155" stroke-width="2"/>

  <ellipse cx="640" cy="400" rx="72" ry="125" fill="#1c2436" stroke="#334155" stroke-width="2"/>
  <circle cx="640" cy="255" r="28" fill="#1c2436" stroke="#334155" stroke-width="2"/>

  <rect x="360" y="600" width="560" height="40" rx="8" fill="#101624" stroke="#2a3348"/>
  <rect x="990" y="150" width="190" height="300" rx="10" fill="#101624" stroke="#2a3348"/>

  <!-- top-left CP -->
  <rect x="90" y="150" width="240" height="64" fill="rgba(251,191,36,0.14)" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 5" rx="8"/>
  <text x="108" y="178" fill="#fcd34d" font-size="18" font-family="sans-serif" font-weight="700">② 左上战力</text>
