<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="战力截图结构示意">
  <rect width="1280" height="720" fill="#0b0f18"/>

  <rect x="60" y="80" width="1160" height="580" rx="16" fill="#141a28" stroke="#2a3348" stroke-width="2"/>
  <rect x="60" y="80" width="1160" height="44" fill="#1a2233"/>
  <text x="90" y="108" fill="#6b7385" font-size="15" font-family="sans-serif">游戏完整界面（示意）</text>

  <!-- left panel -->
  <rect x="90" y="150" width="250" height="340" rx="10" fill="#101624" stroke="#2a3348" stroke-width="1.5"/>
  <text x="115" y="180" fill="#5b6478" font-size="14" font-family="sans-serif">能力值面板</text>
  <polygon points="215,230 255,255 240,300 190,300 175,255" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- character -->
  <ellipse cx="640" cy="400" rx="72" ry="125" fill="#1c2436" stroke="#334155" stroke-width="2"/>
  <circle cx="640" cy="255" r="28" fill="#1c2436" stroke="#334155" stroke-width="2"/>

  <!-- bottom bar -->
  <rect x="360" y="600" width="560" height="40" rx="8" fill="#101624" stroke="#2a3348"/>
  <!-- right list -->
  <rect x="990" y="150" width="190" height="300" rx="10" fill="#101624" stroke="#2a3348"/>

  <!-- 1 blue name -->
  <rect x="520" y="155" width="240" height="58" fill="rgba(56,189,248,0.14)" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 5" rx="8"/>
  <text x="540" y="180" fill="#7dd3fc" font-size="18" font-family="sans-serif" font-weight="700">① 蓝色角色名</text>
  <text x="540" y="202" fill="#a5f3fc" font-size="14" font-family="sans-serif">头顶位置 · 点击此处</text>
  <line x1="640" y1="213" x2="640" y2="245" stroke="#38bdf8" stroke-width="2"/>

  <!-- 2 mid-bottom CP -->
  <rect x="470" y="505" width="340" height="64" fill="rgba(251,191,36,0.14)" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 5" rx="8"/>
  <text x="490" y="533" fill="#fcd34d" font-size="18" font-family="sans-serif" font-weight="700">② 中间偏下战斗力</text>
  <text x="490" y="555" fill="#fde68a" font-size="15" font-family="sans-serif">「战斗力」后面的数字</text>

  <text x="60" y="48" fill="#e5e7eb" font-size="24" font-family="sans-serif" font-weight="700">截图识别结构示意</text>
  <text x="340" y="48" fill="#9aa3b5" font-size="15" font-family="sans-serif">①蓝色名字（点击）　②中间偏下「战斗力」后的数字</text>
</svg>
